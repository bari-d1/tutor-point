<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — TutorPoint Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFEB3C;
      --black:  #2A2A2A;
      --white:  #EEEEEE;
      --gray:   #EDEDEC;
      --pass:   #1f9d55;
      --fail:   #c0392b;
      --radius: 12px;
    }

    body {
      font-family: "Bricolage Grotesque", sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
    }

    /* ── AUTH GATE ── */
    #auth-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }

    .auth-card {
      background: #fff; border: 1.5px solid var(--gray);
      border-radius: var(--radius); padding: 2.5rem 2rem;
      max-width: 380px; width: 100%;
    }
    .auth-card h2 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .auth-card p  { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }

    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .field label { font-size: 0.8rem; font-weight: 600; }
    .field input {
      height: 42px; border: 1.5px solid var(--gray); border-radius: 8px;
      padding: 0 0.9rem; font-family: inherit; font-size: 0.95rem; outline: none;
    }
    .field input:focus { border-color: var(--black); }
    .auth-error { font-size: 0.83rem; color: var(--fail); margin-bottom: 0.75rem; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 40px; padding: 0 1.25rem; border-radius: 999px;
      font-family: inherit; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--black);
      background: var(--black); color: var(--yellow);
      transition: background 0.15s; text-decoration: none;
    }
    .btn:hover { background: #111; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--black); }
    .btn-outline:hover { background: var(--black); color: var(--yellow); }
    .btn-full { width: 100%; border-radius: 8px; height: 44px; font-size: 0.95rem; }

    /* ── MAIN ── */
    #main-screen { display: none; }

    header.admin-header {
      background: var(--black); color: var(--yellow);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px;
    }
    .admin-header-logo { font-weight: 800; font-size: 1rem; background-color: black; }
    .admin-header-right { display: flex; gap: 0.75rem; align-items: center; }

    main.admin-main { padding: 2rem; max-width: 1280px; margin: 0 auto; }

    h1.page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
    .page-sub { font-size: 0.85rem; color: #666; margin-bottom: 1.25rem; }

    /* ── STAT PILLS ── */
    .stat-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }

    .stat-pill {
      background: #fff; border: 1.5px solid var(--gray); border-radius: 999px;
      padding: 0.3rem 1rem; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.12s; user-select: none;
    }
    .stat-pill:hover { border-color: var(--black); }
    .stat-pill.active-pass { background: #f0fff6; border-color: var(--pass); color: var(--pass); }
    .stat-pill.active-fail { background: #fff5f5; border-color: var(--fail); color: var(--fail); }
    .stat-pill.active-all  { background: var(--black); border-color: var(--black); color: var(--yellow); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 0.65rem;
      align-items: center; margin-bottom: 1.25rem;
    }
    .filter-bar input[type="text"],
    .filter-bar select {
      height: 38px; border: 1.5px solid #d4d4d2; border-radius: 8px;
      padding: 0 0.85rem; font-family: inherit; font-size: 0.875rem;
      outline: none; background: #fff; color: var(--black);
    }
    .filter-bar input[type="text"] { min-width: 220px; flex: 1; }
    .filter-bar input[type="text"]:focus,
    .filter-bar select:focus { border-color: var(--black); }
    .filter-bar select { cursor: pointer; }
    .filter-reset {
      font-size: 0.8rem; color: #888; background: none; border: none;
      cursor: pointer; font-family: inherit; padding: 0 0.25rem; text-decoration: underline;
    }
    .filter-reset:hover { color: var(--black); }

    /* ── TABLE ── */
    .table-wrap {
      overflow-x: auto; background: #fff;
      border: 1.5px solid var(--gray); border-radius: var(--radius);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      background: var(--black); color: var(--yellow);
      padding: 0.75rem 1rem; text-align: left; font-weight: 600; white-space: nowrap;
    }
    td {
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--gray);
      vertical-align: middle; white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9f9f7; }

    .badge-pass { color: var(--pass); font-weight: 700; }
    .badge-fail { color: var(--fail); font-weight: 700; }

    /* ── TAGS ── */
    .tag-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; cursor: pointer;
      border: none; font-family: inherit; white-space: nowrap;
      transition: opacity 0.12s;
    }
    .tag-pill:hover { opacity: 0.8; }
    .tag-none {
      background: var(--gray); color: #888;
      border: 1.5px dashed #ccc; padding: 2px 9px;
    }

    /* Tag popover */
    .tag-popover-wrap { position: relative; display: inline-block; }

    .tag-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0.5rem;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      min-width: 160px;
    }
    .tag-popover.open { display: block; }

    .tag-option {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 7px; cursor: pointer;
      font-size: 0.8rem; font-weight: 600;
    }
    .tag-option:hover { background: var(--gray); }
    .tag-option .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tag-option.selected { background: #f3f3f1; }
    .tag-option.clear-opt { color: #888; font-weight: 500; }

    /* ── MODAL ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100;
      align-items: flex-start; justify-content: center;
      padding: 2rem 1rem; overflow-y: auto;
    }
    #modal-overlay.open { display: flex; }

    .modal {
      background: #fff; border-radius: var(--radius);
      width: 100%; max-width: 760px; overflow: hidden; margin: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; background: var(--black); color: var(--yellow);
    }
    .modal-header h3 { font-size: 1rem; }
    .modal-close {
      background: none; border: none; color: var(--yellow);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    .q-row { border: 1.5px solid var(--gray); border-radius: 10px; padding: 1rem; }
    .q-row-header { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.6rem; }
    .q-num {
      font-size: 0.72rem; font-weight: 700; background: var(--gray);
      border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    }
    .q-text { font-size: 0.9rem; line-height: 1.55; font-weight: 500; }
    .q-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.83rem; }
    .answer-box { padding: 0.5rem 0.75rem; border-radius: 8px; border: 1.5px solid var(--gray); }
    .answer-box label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #888; display: block; margin-bottom: 2px; }
    .correct-box   { border-color: var(--pass); background: #f0fff6; }
    .incorrect-box { border-color: var(--fail); background: #fff5f5; }
    .neutral-box   { border-color: var(--gray); }
    .verdict { font-size: 1.1rem; margin-left: 0.25rem; }

    .state-msg { text-align: center; padding: 3rem 1rem; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-screen">
  <div class="auth-card">
    <h2>Admin Login</h2>
    <p>Enter your admin token to view results.</p>
    <div class="field">
      <label for="token-input">Token</label>
      <input id="token-input" type="password" placeholder="••••••••" />
    </div>
    <p id="auth-error" class="auth-error" style="display:none"></p>
    <button class="btn btn-full" id="auth-btn">Sign in</button>
  </div>
</div>

<!-- Main -->
<div id="main-screen">
  <header class="admin-header">
    <div class="admin-header-logo"><img src="/assets/images/logo.svg" alt="TutorPoint" style="height:28px;display:block;" /></div>
    <div class="admin-header-right">
      <button class="btn btn-outline" id="csv-btn" style="border-color:var(--yellow);color:var(--yellow);">Export CSV</button>
      <button class="btn btn-outline" id="refresh-btn" style="border-color:var(--yellow);color:var(--yellow);">Refresh</button>
    </div>
  </header>

  <main class="admin-main">
    <h1 class="page-title">Test Results</h1>
    <p class="page-sub" id="result-count">Loading…</p>

    <div class="stat-row" id="stat-row"></div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search name or email…" />
      <select id="filter-status">
        <option value="all">All results</option>
        <option value="pass">Passed only</option>
        <option value="fail">Failed only</option>
      </select>
      <select id="filter-score">
        <option value="all">Any score</option>
        <option value="90">90%+</option>
        <option value="75">75%+</option>
        <option value="60">60%+</option>
        <option value="0-59">Below 60%</option>
      </select>
      <select id="filter-tag">
        <option value="all">All tags</option>
        <option value="none">No tag</option>
      </select>
      <select id="sort-by">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="score-desc">Score ↓</option>
        <option value="score-asc">Score ↑</option>
        <option value="name-asc">Name A–Z</option>
      </select>
      <button class="filter-reset" id="reset-btn">Clear filters</button>
    </div>

    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name (entered)</th>
            <th>Applicant name</th>
            <th>Email</th>
            <th>Submitted</th>
            <th>Score</th>
            <th>%</th>
            <th>Pass/Fail</th>
            <th>Tag</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr><td colspan="10" class="state-msg">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Answers</h3>
      <button class="modal-close" id="modal-close-btn">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
(() => {
  // ── Tag definitions ───────────────────────────────────
  const TAGS = [
    { key: "shortlisted", label: "Shortlisted", bg: "#dbeafe", color: "#1d4ed8", dot: "#2563eb" },
    { key: "hired",       label: "Hired",       bg: "#dcfce7", color: "#15803d", dot: "#16a34a" },
    { key: "interview",   label: "Interview",   bg: "#ede9fe", color: "#6d28d9", dot: "#7c3aed" },
    { key: "on-hold",     label: "On hold",     bg: "#fef9c3", color: "#854d0e", dot: "#ca8a04" },
    { key: "rejected",    label: "Rejected",    bg: "#fee2e2", color: "#991b1b", dot: "#dc2626" },
  ];

  const TAG_MAP = Object.fromEntries(TAGS.map(t => [t.key, t]));
  const STORAGE_KEY = "tp-admin-tags";

  function loadTagStore() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
  }
  function saveTagStore(store) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  function getTag(sessionId) { return loadTagStore()[sessionId] ?? null; }
  function setTag(sessionId, key) {
    const store = loadTagStore();
    if (key) store[sessionId] = key; else delete store[sessionId];
    saveTagStore(store);
  }

  // Populate tag filter dropdown
  const $filterTag = document.getElementById("filter-tag");
  TAGS.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.key; opt.textContent = t.label;
    $filterTag.appendChild(opt);
  });

  // ── State ─────────────────────────────────────────────
  let token   = "";
  let allData = [];
  let openPopoverId = null;

  const $authScreen   = document.getElementById("auth-screen");
  const $mainScreen   = document.getElementById("main-screen");
  const $authBtn      = document.getElementById("auth-btn");
  const $authError    = document.getElementById("auth-error");
  const $tokenInput   = document.getElementById("token-input");
  const $tbody        = document.getElementById("results-body");
  const $count        = document.getElementById("result-count");
  const $csvBtn       = document.getElementById("csv-btn");
  const $refreshBtn   = document.getElementById("refresh-btn");
  const $overlay      = document.getElementById("modal-overlay");
  const $modalTitle   = document.getElementById("modal-title");
  const $modalBody    = document.getElementById("modal-body");
  const $modalClose   = document.getElementById("modal-close-btn");
  const $searchInput  = document.getElementById("search-input");
  const $filterStatus = document.getElementById("filter-status");
  const $filterScore  = document.getElementById("filter-score");
  const $sortBy       = document.getElementById("sort-by");
  const $resetBtn     = document.getElementById("reset-btn");
  const $statRow      = document.getElementById("stat-row");

  // ── Auth ──────────────────────────────────────────────
  $tokenInput.addEventListener("keydown", (e) => { if (e.key === "Enter") $authBtn.click(); });

  $authBtn.addEventListener("click", async () => {
    const t = $tokenInput.value.trim();
    if (!t) return;
    $authBtn.disabled = true;
    $authError.style.display = "none";
    const ok = await loadResults(t);
    if (ok) {
      token = t;
      $authScreen.style.display = "none";
      $mainScreen.style.display = "block";
    } else {
      $authError.textContent = "Invalid token.";
      $authError.style.display = "block";
    }
    $authBtn.disabled = false;
  });

  // ── Load results ──────────────────────────────────────
  async function loadResults(t) {
    try {
      const res  = await fetch("/api/admin/results", { headers: { Authorization: `Bearer ${t}` } });
      const data = await res.json();
      if (!res.ok || !data.ok) return false;
      allData = data.results;
      renderStats();
      applyFilters();
      return true;
    } catch { return false; }
  }

  $refreshBtn.addEventListener("click", () => loadResults(token));

  // ── Stats pills ───────────────────────────────────────
  function renderStats() {
    const total  = allData.length;
    const passed = allData.filter(r => r.passed).length;
    const failed = total - passed;
    const avgPct = total ? Math.round(allData.reduce((s, r) => s + r.percentage, 0) / total) : 0;

    $statRow.innerHTML = `
      <div class="stat-pill" data-filter="all">All &nbsp;<strong>${total}</strong></div>
      <div class="stat-pill" data-filter="pass">Passed &nbsp;<strong>${passed}</strong></div>
      <div class="stat-pill" data-filter="fail">Failed &nbsp;<strong>${failed}</strong></div>
      <div class="stat-pill" style="cursor:default">Avg score &nbsp;<strong>${avgPct}%</strong></div>
    `;

    $statRow.querySelectorAll("[data-filter]").forEach(pill => {
      pill.addEventListener("click", () => {
        $filterStatus.value = pill.dataset.filter;
        applyFilters();
      });
    });
  }

  function updatePillHighlight(statusVal) {
    $statRow.querySelectorAll("[data-filter]").forEach(pill => {
      pill.classList.remove("active-all", "active-pass", "active-fail");
      if (pill.dataset.filter === statusVal)
        pill.classList.add(statusVal === "all" ? "active-all" : statusVal === "pass" ? "active-pass" : "active-fail");
    });
  }

  // ── Filtering & sorting ───────────────────────────────
  function getFiltered() {
    const q      = $searchInput.value.trim().toLowerCase();
    const status = $filterStatus.value;
    const score  = $filterScore.value;
    const tagF   = $filterTag.value;
    const sort   = $sortBy.value;

    let rows = allData.filter(r => {
      if (q) {
        const hay = `${r.testName} ${r.applicantName} ${r.email}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (status === "pass" && !r.passed) return false;
      if (status === "fail" && r.passed)  return false;
      if (score === "90"   && r.percentage < 90)  return false;
      if (score === "75"   && r.percentage < 75)  return false;
      if (score === "60"   && r.percentage < 60)  return false;
      if (score === "0-59" && r.percentage >= 60) return false;
      if (tagF !== "all") {
        const t = getTag(r.sessionId);
        if (tagF === "none" && t)       return false;
        if (tagF !== "none" && t !== tagF) return false;
      }
      return true;
    });

    rows = rows.slice().sort((a, b) => {
      if (sort === "date-desc")  return new Date(b.submittedAt) - new Date(a.submittedAt);
      if (sort === "date-asc")   return new Date(a.submittedAt) - new Date(b.submittedAt);
      if (sort === "score-desc") return b.percentage - a.percentage;
      if (sort === "score-asc")  return a.percentage - b.percentage;
      if (sort === "name-asc")   return (a.testName ?? "").localeCompare(b.testName ?? "");
      return 0;
    });

    return rows;
  }

  function applyFilters() {
    updatePillHighlight($filterStatus.value);
    renderTable(getFiltered());
  }

  [$searchInput, $filterStatus, $filterScore, $filterTag, $sortBy].forEach(el => {
    el.addEventListener("input", applyFilters);
  });

  $resetBtn.addEventListener("click", () => {
    $searchInput.value  = "";
    $filterStatus.value = "all";
    $filterScore.value  = "all";
    $filterTag.value    = "all";
    $sortBy.value       = "date-desc";
    applyFilters();
  });

  // ── Render table ──────────────────────────────────────
  function fmt(dateStr) {
    return new Date(dateStr).toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function renderTagPill(sessionId) {
    const key  = getTag(sessionId);
    const tag  = key ? TAG_MAP[key] : null;

    const pill = tag
      ? `<button class="tag-pill" style="background:${tag.bg};color:${tag.color}" data-tag-btn="${sessionId}">
           <span style="width:7px;height:7px;border-radius:50%;background:${tag.dot};flex-shrink:0;display:inline-block"></span>
           ${tag.label}
         </button>`
      : `<button class="tag-pill tag-none" data-tag-btn="${sessionId}">+ Tag</button>`;

    const options = TAGS.map(t => `
      <div class="tag-option${key === t.key ? " selected" : ""}" data-tag-key="${t.key}" data-sid="${sessionId}">
        <span class="dot" style="background:${t.dot}"></span>${t.label}
      </div>
    `).join("") + `
      <div class="tag-option clear-opt" data-tag-key="" data-sid="${sessionId}" style="border-top:1px solid var(--gray);margin-top:4px;padding-top:8px">
        ✕ Clear tag
      </div>
    `;

    return `
      <div class="tag-popover-wrap">
        ${pill}
        <div class="tag-popover" id="pop-${sessionId}">
          ${options}
        </div>
      </div>
    `;
  }

  function renderTable(rows) {
    const total = allData.length;
    $count.textContent = rows.length === total
      ? `${total} submission${total !== 1 ? "s" : ""}`
      : `${rows.length} of ${total} submission${total !== 1 ? "s" : ""} (filtered)`;

    if (!rows.length) {
      $tbody.innerHTML = `<tr><td colspan="10" class="state-msg">No results match your filters.</td></tr>`;
      return;
    }

    $tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(r.testName)}</td>
        <td>${esc(r.applicantName)}</td>
        <td>${esc(r.email)}</td>
        <td>${fmt(r.submittedAt)}</td>
        <td>${r.score} / ${r.total}</td>
        <td>${r.percentage}%</td>
        <td class="${r.passed ? "badge-pass" : "badge-fail"}">${r.passed ? "✓ Pass" : "✗ Fail"}</td>
        <td>${renderTagPill(r.sessionId)}</td>
        <td><button class="btn btn-outline" style="height:32px;font-size:0.78rem;padding:0 0.9rem" data-sid="${esc(r.sessionId)}">View answers</button></td>
      </tr>
    `).join("");

    // Tag pill toggles
    $tbody.querySelectorAll("[data-tag-btn]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const sid = btn.dataset.tagBtn;
        const pop = document.getElementById(`pop-${sid}`);
        const isOpen = pop.classList.contains("open");
        closeAllPopovers();
        if (!isOpen) { pop.classList.add("open"); openPopoverId = sid; }
      });
    });

    // Tag options
    $tbody.querySelectorAll("[data-tag-key]").forEach(opt => {
      opt.addEventListener("click", (e) => {
        e.stopPropagation();
        const sid = opt.dataset.sid;
        const key = opt.dataset.tagKey;
        setTag(sid, key || null);
        closeAllPopovers();
        applyFilters();
      });
    });

    // View answers
    $tbody.querySelectorAll("button[data-sid]").forEach(btn => {
      if (btn.dataset.tagBtn !== undefined) return;
      btn.addEventListener("click", () => {
        const row = allData.find(r => r.sessionId === btn.dataset.sid);
        if (row) openModal(row);
      });
    });
  }

  function closeAllPopovers() {
    document.querySelectorAll(".tag-popover.open").forEach(p => p.classList.remove("open"));
    openPopoverId = null;
  }

  document.addEventListener("click", closeAllPopovers);

  function esc(s) {
    return String(s ?? "—").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── Modal ─────────────────────────────────────────────
  function openModal(row) {
    $modalTitle.textContent = `${row.testName} — ${row.score}/${row.total} (${row.percentage}%)`;
    const questions = row.questions ?? [];
    const answers   = row.answers   ?? {};

    $modalBody.innerHTML = questions.map((q, i) => {
      const isMCQ     = !!(q.optionA || q.optionB);
      const correct   = isMCQ ? q.correct : q.answer;
      const submitted = String(answers[q.id] ?? "").trim();
      const isCorrect = submitted.toLowerCase() === String(correct ?? "").trim().toLowerCase();
      const verdict   = submitted ? (isCorrect ? "✅" : "❌") : "—";

      return `
        <div class="q-row">
          <div class="q-row-header">
            <span class="q-num">Q${i + 1} · ${q.source ?? ""}</span>
            <span class="q-text">${esc(q.question)}</span>
          </div>
          <div class="q-answers">
            <div class="answer-box ${submitted ? (isCorrect ? "correct-box" : "incorrect-box") : "neutral-box"}">
              <label>Tutor's answer</label>
              <span>${esc(submitted || "No answer")} <span class="verdict">${verdict}</span></span>
            </div>
            <div class="answer-box correct-box">
              <label>Correct answer</label>
              <span>${esc(correct ?? "—")}</span>
            </div>
          </div>
        </div>
      `;
    }).join("");

    $overlay.classList.add("open");
  }

  $modalClose.addEventListener("click", () => $overlay.classList.remove("open"));
  $overlay.addEventListener("click", (e) => { if (e.target === $overlay) $overlay.classList.remove("open"); });

  // ── CSV export (current filtered view) ────────────────
  $csvBtn.addEventListener("click", () => {
    const filtered = getFiltered();
    if (!filtered.length) return;

    const headers = ["#","Name (entered)","Applicant name","Email","Submitted","Score","Total","Percentage","Pass/Fail","Tag","Session ID"];
    const rows = filtered.map((r, i) => {
      const tagKey = getTag(r.sessionId);
      const tagLabel = tagKey ? (TAG_MAP[tagKey]?.label ?? tagKey) : "";
      return [
        i + 1, r.testName, r.applicantName, r.email,
        new Date(r.submittedAt).toISOString(),
        r.score, r.total, r.percentage + "%",
        r.passed ? "Pass" : "Fail",
        tagLabel,
        r.sessionId,
      ].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",");
    });

    const csv  = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `tutorpoint-results-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
