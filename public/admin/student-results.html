<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Tests — TutorPoint Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFEB3C;
      --black:  #2A2A2A;
      --white:  #EEEEEE;
      --gray:   #EDEDEC;
      --pass:   #1f9d55;
      --fail:   #c0392b;
      --pending:#b8860b;
      --radius: 12px;
    }

    body {
      font-family: "Bricolage Grotesque", sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
    }

    /* ── AUTH GATE ── */
    #auth-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }

    .auth-card {
      background: #fff; border: 1.5px solid var(--gray);
      border-radius: var(--radius); padding: 2.5rem 2rem;
      max-width: 380px; width: 100%;
    }
    .auth-card h2 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .auth-card p  { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }

    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .field label { font-size: 0.8rem; font-weight: 600; }
    .field input, .field select {
      height: 42px; border: 1.5px solid var(--gray); border-radius: 8px;
      padding: 0 0.9rem; font-family: inherit; font-size: 0.95rem; outline: none;
      background: #fff;
    }
    .field input:focus { border-color: var(--black); }
    .auth-error { font-size: 0.83rem; color: var(--fail); margin-bottom: 0.75rem; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 40px; padding: 0 1.25rem; border-radius: 999px;
      font-family: inherit; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--black);
      background: var(--black); color: var(--yellow);
      transition: background 0.15s; text-decoration: none;
    }
    .btn:hover { background: #111; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-outline { background: transparent; color: var(--black); }
    .btn-outline:hover { background: var(--black); color: var(--white); }
    .btn-sm { height: 32px; padding: 0 0.85rem; font-size: 0.8rem; }

    /* ── HEADER ── */
    #main-screen { display: none; }
    #main-screen.open { display: block; }

    .admin-header {
      background: var(--black); color: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; gap: 1rem; flex-wrap: wrap;
    }
    .admin-header-right { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .admin-nav a {
      color: var(--white); text-decoration: none; font-size: 0.85rem;
      opacity: 0.7; margin-left: 1rem;
    }
    .admin-nav a:hover { opacity: 1; }

    .admin-main { max-width: 1180px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    .page-title { font-size: 1.6rem; margin-bottom: 0.25rem; }
    .page-sub { font-size: 0.88rem; color: #666; margin-bottom: 1.5rem; }

    /* ── STATS ── */
    .stat-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .stat {
      background: #fff; border: 1.5px solid var(--gray);
      border-radius: var(--radius); padding: 1rem 1.15rem;
    }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; font-weight: 600; }
    .stat-value { font-size: 1.7rem; font-weight: 800; line-height: 1.2; margin-top: 0.2rem; }
    .stat.accent { background: var(--yellow); border-color: var(--yellow); }

    /* ── FILTERS ── */
    .filter-bar {
      display: flex; gap: 0.6rem; margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      height: 40px; border: 1.5px solid var(--gray); border-radius: 8px;
      padding: 0 0.9rem; font-family: inherit; font-size: 0.9rem;
      outline: none; background: #fff;
    }
    .filter-bar input { flex: 1 1 220px; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--black); }

    /* ── TABLE ── */
    .table-wrap {
      background: #fff; border: 1.5px solid var(--gray);
      border-radius: var(--radius); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 0.8rem 1rem; text-align: left; white-space: nowrap; }
    th {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: #888; border-bottom: 1.5px solid var(--gray); font-weight: 600;
    }
    tbody tr { border-bottom: 1px solid var(--gray); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafaf8; }

    .pill {
      display: inline-block; border-radius: 999px; padding: 3px 10px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pill-pending { background: #fff4d6; color: var(--pending); }
    .pill-marked  { background: #e8f8ef; color: var(--pass); }
    .pill-progress{ background: var(--gray); color: #777; }
    .pill-test    { background: #ede7ff; color: #6b4fd8; }
    .pill-level   { background: var(--black); color: var(--yellow); }

    .muted { color: #999; }

    /* ── MODAL ── */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 200;
      align-items: flex-start; justify-content: center; padding: 2rem 1rem;
      overflow-y: auto;
    }
    .modal.open { display: flex; }

    .modal-box {
      background: var(--white); border-radius: var(--radius);
      max-width: 820px; width: 100%; overflow: hidden;
    }
    .modal-header {
      background: #fff; padding: 1.25rem 1.5rem;
      border-bottom: 1.5px solid var(--gray);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      position: sticky; top: 0; z-index: 2;
    }
    .modal-header h3 { font-size: 1.1rem; margin-bottom: 0.2rem; }
    .modal-header p  { font-size: 0.8rem; color: #777; }
    .modal-close {
      background: none; border: none; font-size: 1.4rem; cursor: pointer; line-height: 1; color: #888;
    }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.85rem; }

    .q-row { background: #fff; border: 1.5px solid var(--gray); border-radius: 10px; padding: 1rem; }
    .q-row.is-right { border-color: var(--pass); }
    .q-row.is-wrong { border-color: var(--fail); }

    .q-row-header { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.6rem; }
    .q-num {
      font-size: 0.72rem; font-weight: 700; background: var(--gray);
      border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    }
    .q-text { font-size: 0.9rem; line-height: 1.55; font-weight: 500; }
    .q-topic { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-top: 0.25rem; }

    .q-figure {
      margin: 0.5rem 0 0.75rem; border: 1.5px solid var(--gray); border-radius: 8px;
      padding: 0.6rem; background: #fff; text-align: center; overflow-x: auto;
    }
    .q-figure img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

    .q-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.85rem; margin-bottom: 0.6rem; }
    .answer-box { padding: 0.5rem 0.75rem; border-radius: 8px; border: 1.5px solid var(--gray); background: #fff; white-space: pre-wrap; word-break: break-word; }
    .answer-box label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: #888; display: block; margin-bottom: 3px; letter-spacing: 0.04em; }
    .key-box { background: #f7f7f5; }
    .blank { color: #bbb; font-style: italic; }

    .mark-row { display: flex; align-items: center; gap: 0.5rem; }
    .mark-btn {
      height: 30px; padding: 0 0.8rem; border-radius: 999px;
      border: 1.5px solid var(--gray); background: #fff; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; font-weight: 600; color: #777;
    }
    .mark-btn.active-right { background: var(--pass); border-color: var(--pass); color: #fff; }
    .mark-btn.active-wrong { background: var(--fail); border-color: var(--fail); color: #fff; }

    .modal-footer {
      background: #fff; border-top: 1.5px solid var(--gray);
      padding: 1.1rem 1.5rem; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      position: sticky; bottom: 0;
    }
    .score-readout { font-size: 1.1rem; font-weight: 700; }
    .score-readout span { font-size: 0.8rem; font-weight: 500; color: #888; }
    .footer-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .footer-actions input {
      height: 38px; border: 1.5px solid var(--gray); border-radius: 8px;
      padding: 0 0.8rem; font-family: inherit; font-size: 0.85rem; outline: none; width: 150px;
    }
    .save-note { font-size: 0.8rem; }
    .save-note.ok  { color: var(--pass); }
    .save-note.err { color: var(--fail); }

    .state-msg { text-align: center; padding: 3rem 1rem; color: #888; font-size: 0.9rem; }

    @media (max-width: 620px) {
      .admin-header { padding: 1rem; }
      .admin-main { padding: 1.5rem 1rem 4rem; }
      .q-answers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-screen">
  <div class="auth-card">
    <h2>Admin Login</h2>
    <p>Enter your admin token to view student submissions.</p>
    <div class="field">
      <label for="token-input">Token</label>
      <input id="token-input" type="password" placeholder="••••••••" />
    </div>
    <p id="auth-error" class="auth-error" style="display:none"></p>
    <button class="btn btn-full" id="auth-btn">Sign in</button>
  </div>
</div>

<!-- Main -->
<div id="main-screen">
  <header class="admin-header">
    <div style="display:flex;align-items:center;">
      <img src="/assets/images/logo.svg" alt="TutorPoint" style="height:28px;display:block;" />
      <nav class="admin-nav">
        <a href="/admin/results">Tutor results</a>
        <a href="/admin/student-results" style="opacity:1;font-weight:600;">Student tests</a>
      </nav>
    </div>
    <div class="admin-header-right">
      <button class="btn btn-outline" id="csv-btn" style="border-color:var(--yellow);color:var(--yellow);">Export CSV</button>
      <button class="btn btn-outline" id="refresh-btn" style="border-color:var(--yellow);color:var(--yellow);">Refresh</button>
    </div>
  </header>

  <main class="admin-main">
    <h1 class="page-title">Student Tests</h1>
    <p class="page-sub" id="result-count">Loading…</p>

    <div class="stat-row" id="stat-row"></div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search student, parent or email…" />
      <select id="filter-status">
        <option value="all">All submissions</option>
        <option value="PENDING">Awaiting marking</option>
        <option value="MARKED">Marked</option>
        <option value="IN_PROGRESS">In progress</option>
      </select>
      <select id="filter-level">
        <option value="all">All levels</option>
        <option value="SS2">SS2</option>
        <option value="SS3">SS3</option>
      </select>
      <select id="filter-accounts">
        <option value="all">All accounts</option>
        <option value="real">Real students only</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Class</th>
            <th>Level</th>
            <th>Status</th>
            <th>Score</th>
            <th>Answered</th>
            <th>Submitted</th>
            <th>Marked by</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="state-msg" id="state-msg" style="display:none;"></div>
    </div>
  </main>
</div>

<!-- Marking modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h3 id="modal-title">—</h3>
        <p id="modal-sub">—</p>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <div class="score-readout" id="score-readout">— <span>marked correct</span></div>
      <div class="footer-actions">
        <span class="save-note" id="save-note"></span>
        <input type="text" id="marked-by" placeholder="Marked by…" />
        <button class="btn btn-outline btn-sm" id="reopen-btn">Reopen</button>
        <button class="btn" id="save-btn">Save score</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_TOKEN = "tp_admin_token";
  const STORAGE_MARKER = "tp_admin_marker";

  let token = "";
  let results = [];
  let openRow = null;
  let verdicts = {};   // { [questionId]: true|false|undefined }

  const $ = (id) => document.getElementById(id);

  const $auth = $("auth-screen");
  const $main = $("main-screen");
  const $tokenInput = $("token-input");
  const $authErr = $("auth-error");
  const $authBtn = $("auth-btn");

  const $count = $("result-count");
  const $stats = $("stat-row");
  const $tbody = $("table-body");
  const $state = $("state-msg");

  const $search = $("search-input");
  const $fStatus = $("filter-status");
  const $fLevel = $("filter-level");
  const $fAccounts = $("filter-accounts");

  const $modal = $("modal");
  const $mTitle = $("modal-title");
  const $mSub = $("modal-sub");
  const $mBody = $("modal-body");
  const $readout = $("score-readout");
  const $markedBy = $("marked-by");
  const $saveBtn = $("save-btn");
  const $reopenBtn = $("reopen-btn");
  const $saveNote = $("save-note");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function fmtDate(d) {
    if (!d) return "—";
    const dt = new Date(d);
    return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })
      + " " + dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function statusOf(r) {
    if (!r.submittedAt) return "IN_PROGRESS";
    return r.markingStatus;
  }

  function statusPill(r) {
    const s = statusOf(r);
    if (s === "IN_PROGRESS") return '<span class="pill pill-progress">In progress</span>';
    if (s === "MARKED") return '<span class="pill pill-marked">Marked</span>';
    return '<span class="pill pill-pending">Awaiting marking</span>';
  }

  // ── Auth ─────────────────────────────────────────────
  async function signIn(t) {
    $authErr.style.display = "none";
    $authBtn.disabled = true;
    $authBtn.textContent = "Signing in…";
    try {
      const res = await fetch("/api/admin/student-results", { headers: { Authorization: `Bearer ${t}` } });
      if (res.status === 401) {
        $authErr.textContent = "Invalid token.";
        $authErr.style.display = "block";
        localStorage.removeItem(STORAGE_TOKEN);
        return false;
      }
      const data = await res.json();
      if (!res.ok || !data.ok) {
        $authErr.textContent = data.error ?? "Could not load submissions.";
        $authErr.style.display = "block";
        return false;
      }
      token = t;
      localStorage.setItem(STORAGE_TOKEN, t);
      results = data.results;
      $auth.style.display = "none";
      $main.classList.add("open");
      renderAll();
      return true;
    } catch {
      $authErr.textContent = "Network error.";
      $authErr.style.display = "block";
      return false;
    } finally {
      $authBtn.disabled = false;
      $authBtn.textContent = "Sign in";
    }
  }

  $authBtn.addEventListener("click", () => {
    const t = $tokenInput.value.trim();
    if (t) signIn(t);
  });
  $tokenInput.addEventListener("keydown", (e) => { if (e.key === "Enter") $authBtn.click(); });

  async function reload() {
    try {
      const res = await fetch("/api/admin/student-results", { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (data.ok) { results = data.results; renderAll(); }
    } catch {}
  }

  $("refresh-btn").addEventListener("click", reload);

  // Poll so an open dashboard picks up new submissions on its own. Skipped while a
  // paper is being marked, so the modal doesn't get pulled out from under you.
  setInterval(() => { if (token && !openRow) reload(); }, 20000);

  // Also refresh when you come back to the tab.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && token && !openRow) reload();
  });

  // ── Filtering + render ───────────────────────────────
  function visibleRows() {
    const q = $search.value.trim().toLowerCase();
    return results.filter((r) => {
      if ($fAccounts.value === "real" && r.isTestAccount) return false;
      if ($fStatus.value !== "all" && statusOf(r) !== $fStatus.value) return false;
      if ($fLevel.value !== "all" && r.classLevel !== $fLevel.value) return false;
      if (!q) return true;
      return [r.studentName, r.childName, r.parentName, r.parentEmail, r.parentPhone]
        .join(" ").toLowerCase().includes(q);
    });
  }

  function renderStats() {
    const pool = results.filter((r) => $fAccounts.value === "all" || !r.isTestAccount);
    const submitted = pool.filter((r) => r.submittedAt);
    const pending = submitted.filter((r) => r.markingStatus === "PENDING");
    const marked = submitted.filter((r) => r.markingStatus === "MARKED");
    const inProgress = pool.filter((r) => !r.submittedAt);
    const avg = marked.length
      ? Math.round(marked.reduce((a, r) => a + (r.score / r.total) * 100, 0) / marked.length)
      : null;

    $stats.innerHTML = `
      <div class="stat ${pending.length ? "accent" : ""}">
        <div class="stat-label">Awaiting marking</div>
        <div class="stat-value">${pending.length}</div>
      </div>
      <div class="stat"><div class="stat-label">Marked</div><div class="stat-value">${marked.length}</div></div>
      <div class="stat"><div class="stat-label">In progress</div><div class="stat-value">${inProgress.length}</div></div>
      <div class="stat"><div class="stat-label">Submitted total</div><div class="stat-value">${submitted.length}</div></div>
      <div class="stat"><div class="stat-label">Average score</div><div class="stat-value">${avg === null ? "—" : avg + "%"}</div></div>
    `;
  }

  function renderTable() {
    const rows = visibleRows();
    $tbody.innerHTML = "";

    if (!rows.length) {
      $state.style.display = "block";
      $state.textContent = results.length
        ? "No submissions match these filters."
        : "No student has taken a test yet.";
      return;
    }
    $state.style.display = "none";

    for (const r of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <strong>${esc(r.studentName)}</strong>
          ${r.isTestAccount ? '<span class="pill pill-test" style="margin-left:6px;">test</span>' : ""}
          <div class="muted" style="font-size:0.78rem;">${esc(r.parentEmail)}</div>
        </td>
        <td>${esc(r.childClass)}</td>
        <td><span class="pill pill-level">${esc(r.classLevel)}</span></td>
        <td>${statusPill(r)}</td>
        <td>${r.score === null ? '<span class="muted">—</span>'
              : `<strong>${r.score}/${r.total}</strong> <span class="muted">(${Math.round((r.score / r.total) * 100)}%)</span>`}</td>
        <td>${r.answered}/${r.total}</td>
        <td>${fmtDate(r.submittedAt)}</td>
        <td>${esc(r.markedBy ?? "—")}</td>
        <td><button class="btn btn-outline btn-sm">${r.submittedAt ? "Mark" : "View"}</button></td>
      `;
      tr.querySelector("button").addEventListener("click", () => openModal(r));
      $tbody.appendChild(tr);
    }
  }

  function renderAll() {
    const shown = visibleRows().length;
    $count.textContent = `${shown} of ${results.length} sitting${results.length === 1 ? "" : "s"} shown`;
    renderStats();
    renderTable();
  }

  [$search, $fStatus, $fLevel, $fAccounts].forEach((el) =>
    el.addEventListener("input", renderAll));

  // ── Marking modal ────────────────────────────────────
  function updateReadout() {
    const right = Object.values(verdicts).filter((v) => v === true).length;
    const judged = Object.values(verdicts).filter((v) => v !== undefined).length;
    const tot = openRow.total;
    const pct = Math.round((right / tot) * 100);
    $readout.innerHTML = `${right} / ${tot} <span>correct &middot; ${pct}% &middot; ${judged} of ${tot} reviewed</span>`;
  }

  function openModal(r) {
    openRow = r;
    verdicts = {};
    $saveNote.textContent = "";
    $saveNote.className = "save-note";
    $markedBy.value = localStorage.getItem(STORAGE_MARKER) ?? "";

    $mTitle.textContent = `${r.studentName} — ${r.classLevel} maths`;
    $mSub.textContent = [
      r.childClass,
      `${r.answered}/${r.total} answered`,
      r.submittedAt ? `submitted ${fmtDate(r.submittedAt)}` : "not submitted yet",
      r.parentEmail
    ].join(" · ");

    $mBody.innerHTML = "";

    r.questions.forEach((q, i) => {
      const given = String(r.answers?.[q.id] ?? "").trim();

      const row = document.createElement("div");
      row.className = "q-row";
      row.innerHTML = `
        <div class="q-row-header">
          <span class="q-num">Q${i + 1}</span>
          <div>
            <div class="q-text">${esc(q.question)}</div>
            <div class="q-topic">${esc(q.section ?? "")}${q.topic ? " · " + esc(q.topic) : ""}${q.marks ? " · " + q.marks + " mark" + (q.marks > 1 ? "s" : "") : ""}</div>
          </div>
        </div>
        ${q.image ? `<div class="q-figure"><img src="${esc(q.image)}" alt="${esc(q.imageAlt ?? "Diagram for this question")}" /></div>` : ""}
        <div class="q-answers">
          <div class="answer-box">
            <label>Student answer</label>
            ${given ? esc(given) : '<span class="blank">No answer given</span>'}
          </div>
          <div class="answer-box key-box">
            <label>Expected answer</label>
            ${esc(q.answer ?? "—")}
          </div>
        </div>
        <div class="mark-row">
          <button class="mark-btn" data-v="right">✓ Correct</button>
          <button class="mark-btn" data-v="wrong">✕ Wrong</button>
        </div>
      `;

      const [rightBtn, wrongBtn] = row.querySelectorAll(".mark-btn");

      function paint() {
        const v = verdicts[q.id];
        rightBtn.classList.toggle("active-right", v === true);
        wrongBtn.classList.toggle("active-wrong", v === false);
        row.classList.toggle("is-right", v === true);
        row.classList.toggle("is-wrong", v === false);
        updateReadout();
      }

      rightBtn.addEventListener("click", () => {
        verdicts[q.id] = verdicts[q.id] === true ? undefined : true;
        paint();
      });
      wrongBtn.addEventListener("click", () => {
        verdicts[q.id] = verdicts[q.id] === false ? undefined : false;
        paint();
      });

      // Unanswered questions start as wrong — the marker can override.
      if (!given) verdicts[q.id] = false;

      $mBody.appendChild(row);
      paint();
    });

    $saveBtn.disabled = !r.submittedAt;
    $reopenBtn.style.display = r.markingStatus === "MARKED" ? "inline-flex" : "none";
    updateReadout();
    $modal.classList.add("open");
  }

  function closeModal() { $modal.classList.remove("open"); openRow = null; }

  $("modal-close").addEventListener("click", closeModal);
  $modal.addEventListener("click", (e) => { if (e.target === $modal) closeModal(); });

  $saveBtn.addEventListener("click", async () => {
    const score = Object.values(verdicts).filter((v) => v === true).length;
    const markedBy = $markedBy.value.trim();

    $saveBtn.disabled = true;
    $saveBtn.textContent = "Saving…";
    $saveNote.textContent = "";

    try {
      const res = await fetch("/api/admin/student-mark", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ sessionId: openRow.sessionId, score, markedBy }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        $saveNote.textContent = data.error ?? "Could not save.";
        $saveNote.className = "save-note err";
        return;
      }

      if (markedBy) localStorage.setItem(STORAGE_MARKER, markedBy);
      $saveNote.textContent = `Saved — ${data.score}/${data.total}`;
      $saveNote.className = "save-note ok";
      await reload();
      setTimeout(closeModal, 700);
    } catch {
      $saveNote.textContent = "Network error.";
      $saveNote.className = "save-note err";
    } finally {
      $saveBtn.disabled = false;
      $saveBtn.textContent = "Save score";
    }
  });

  $reopenBtn.addEventListener("click", async () => {
    try {
      const res = await fetch("/api/admin/student-mark", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ sessionId: openRow.sessionId, reopen: true }),
      });
      const data = await res.json();
      if (data.ok) {
        $saveNote.textContent = "Sent back to the queue";
        $saveNote.className = "save-note ok";
        await reload();
        setTimeout(closeModal, 700);
      }
    } catch {}
  });

  // ── CSV export ───────────────────────────────────────
  $("csv-btn").addEventListener("click", () => {
    const rows = visibleRows();
    const header = ["Student", "Class", "Level", "Status", "Score", "Total", "Percent", "Answered", "Submitted", "Marked by", "Parent", "Email", "Phone"];
    const body = rows.map((r) => [
      r.studentName, r.childClass, r.classLevel, statusOf(r),
      r.score ?? "", r.total, r.score === null ? "" : Math.round((r.score / r.total) * 100),
      r.answered, r.submittedAt ?? "", r.markedBy ?? "",
      r.parentName, r.parentEmail, r.parentPhone
    ]);
    const csv = [header, ...body]
      .map((row) => row.map((v) => {
        const s = String(v ?? "");
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      }).join(","))
      .join("\n");

    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "student-test-results.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ── Boot: reuse a stored token, or ask for one ────────
  const saved = localStorage.getItem(STORAGE_TOKEN);
  if (saved) signIn(saved);
})();
</script>
</body>
</html>
