<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — TutorPoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Bricolage Grotesque", sans-serif;
      background: #EEEEEE;
      color: #2A2A2A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border: 1.5px solid #EDEDEC;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #FFEB3C;
      -webkit-text-stroke: 2px #2A2A2A;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 1.5rem;
      border-radius: 999px;
      background: #2A2A2A;
      color: #FFEB3C;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #111; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TutorPoint</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The link you followed doesn't exist or is no longer valid. Please check the link you were sent and try again.</p>
    <a href="/">Go to homepage</a>
  </div>
</body>
</html>
